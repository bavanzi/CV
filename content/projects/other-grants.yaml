- path: "https://www.naturalhazards.com.au/research/research-projects/evaluating-resilient-homes-fund"
  title: "(2024-2027) Natural Hazards Research Australia (NHRA) Projects T4-A6a: Evaluating the Resilient Homes Fund (QLD component) and T4-A6b: Evaluating the Resilient Homes Program (NSW component)"
  description: "Co-funded by the Queensland Reconstruction Authority and Natural Hazards Research Australia, this project evaluates Queensland's Resilient Homes Fund, addressing four dimensions of resilience (physical, financial, social, and emotional) by assessing buy-back, retrofit and house-raising, to demonstrate the success factors and lessons learnt for each as they link to the four resilience dimensions. A second component evaluates the NSW Resilient Homes Program, with the NSW Reconstruction Authority as strategic partner."
  Investigators: "Chief Investigator: Prof Paula Jarzabkowski (UQ). Named researchers on both components: Prof Benjamin Avanzi (University of Melbourne), A/Prof Matthew Mason (UQ). QLD component: Dr Katie Meissner, Dr Laurel Johnson, A/Prof Stephanie Wyeth, Prof Alicia Rambaldi (UQ). NSW component: Dr Tyler Riordan, Dr Renee Zahnow (UQ)"
  date: 1 January 2024
  categories: [Other External Competitive]

